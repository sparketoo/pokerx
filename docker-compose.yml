name: pokerx

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pokerx-hyperf:local
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-PokerX}
      APP_ENV: ${APP_ENV:-dev}
      APP_KEY: ${APP_KEY:-base64:4RXwsfBQ2jOlWtobzSStUS1pLQ1b0C51IQHG/rCcRXc=}
      SCAN_CACHEABLE: ${SCAN_CACHEABLE:-false}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 18080
      POKER_WS_HOST: 0.0.0.0
      POKER_WS_PORT: 18081
      WORKER_NUM: ${WORKER_NUM:-2}
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-pokerx}
      DB_USERNAME: ${MYSQL_USER:-pokerx}
      DB_PASSWORD: ${MYSQL_PASSWORD:-pokerx}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_COLLATION: ${DB_COLLATION:-utf8mb4_unicode_ci}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-pokerx:}
      POKER_PROVIDER: ${POKER_PROVIDER:-mock}
      PROTO_URL: ${PROTO_URL:-}
      PROTO_TOKEN: ${PROTO_TOKEN:-}
      PROTO_NETWORK: ${PROTO_NETWORK:-WE}
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-50}
      MOCK_FAILURE: ${MOCK_FAILURE:-false}
      POKER_INCOMPLETE_AFTER: ${POKER_INCOMPLETE_AFTER:-1800}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      MYSQL_WAIT_TIMEOUT: ${MYSQL_WAIT_TIMEOUT:-60}
    ports:
      - "${HTTP_PORT:-18080}:18080"
      - "${POKER_WS_PORT:-18081}:18081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: >-
        php -r 'exit(@file_get_contents("http://127.0.0.1:18080/api/health") === false ? 1 : 0);'
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pokerx}
      MYSQL_USER: ${MYSQL_USER:-pokerx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pokerx}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
